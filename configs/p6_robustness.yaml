  - data/processed/p5_orders_2016_2025.parquet
  - data/processed/p5_oos_daily_portfolio_2022_2025.parquet
  - data/processed/p5_oos_actual_holdings_2022_2025.parquet
  - data/processed/p5_oos_orders_2022_2025.parquet
  - results/p5_oos/oos_performance.csv
  - results/p5_oos/annual_performance.csv
  - results/p5_oos/ic_summary.csv
  - data/processed/daily_panel.parquet
  - data/processed/month_end_base_panel.parquet
  - data/processed/execution_status.parquet
