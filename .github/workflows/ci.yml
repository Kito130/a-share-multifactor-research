name: A-share public checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a-share-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install public dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile public source
        run: python -m compileall -q src scripts tests
      - name: Synthetic factor demo
        run: python scripts/run_public_demo.py
      - name: Public tests
        run: python -m pytest -q -p no:cacheprovider
